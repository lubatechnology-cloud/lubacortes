name: Lubacortes Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: lubacortes-worker
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      npm_config_onnxruntime_node_install_cuda: skip
      npm_config_yes: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Processar tarefas de vídeo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          PAYMENT_TEST_CONFIRM_TOKEN: ${{ secrets.PAYMENT_TEST_CONFIRM_TOKEN }}
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
          TRANSCRIPTION_PROVIDER: groq
          TRANSLATION_PROVIDER: groq
          WATERMARK_FONT_PATH: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          FFMPEG_PATH: /usr/bin/ffmpeg
          FFPROBE_PATH: /usr/bin/ffprobe
          GHA_MAX_JOBS: "8"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          npm run worker:once
