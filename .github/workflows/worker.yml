name: Lubacortes Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: lubacortes-worker
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NODE_ENV: production
      npm_config_onnxruntime_node_install_cuda: skip
      npm_config_yes: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - name: Preparar saída de rede para o YouTube (WARP com rotação)
        run: |
          set +e
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          sudo warp-cli --accept-tos registration new >/dev/null 2>&1
          BIN=$(find node_modules/youtube-dl-exec/bin -maxdepth 1 -type f | head -1)
          chmod +x "$BIN"
          OK=0
          for i in 1 2 3 4 5 6; do
            sudo warp-cli disconnect >/dev/null 2>&1
            sleep 2
            sudo warp-cli --accept-tos connect >/dev/null 2>&1
            sleep 6
            IP=$(curl -s --max-time 10 https://ipinfo.io/json | grep -o '"ip": "[^"]*"' | head -1)
            echo "[warp] tentativa $i: $IP"
            if "$BIN" --dump-single-json --skip-download --no-warnings \
                --extractor-args "youtube:player_client=web_safari,android,tv_embedded,ios" \
                "https://www.youtube.com/watch?v=FqncTKI5gd8" >/dev/null 2>&1; then
              echo "[warp] IP aprovado pelo YouTube: $IP"
              OK=1
              break
            fi
          done
          if [ "$OK" -ne 1 ]; then echo "[warp] nenhum IP aprovado; o worker continua sem WARP"; fi
      - name: Processar tarefas de vídeo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          PAYMENT_TEST_CONFIRM_TOKEN: ${{ secrets.PAYMENT_TEST_CONFIRM_TOKEN }}
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
          TRANSCRIPTION_PROVIDER: groq
          TRANSLATION_PROVIDER: groq
          WATERMARK_FONT_PATH: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          FFMPEG_PATH: /usr/bin/ffmpeg
          FFPROBE_PATH: /usr/bin/ffprobe
          GHA_MAX_JOBS: "8"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          npm run worker:once
