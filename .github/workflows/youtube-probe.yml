name: YouTube probe

# Teste isolado (manual): verifica se o worker consegue extrair metadados
# de um vídeo público do YouTube com uma saída de rede diferente (WARP).
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      npm_config_onnxruntime_node_install_cuda: skip
      npm_config_yes: "true"
      FFMPEG_STATIC_SKIP_DOWNLOAD: "1"
      FFPROBE_STATIC_SKIP_DOWNLOAD: "1"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - name: IP antes
        run: curl -s --max-time 15 https://ipinfo.io/json || true
      - name: Instalar e ligar Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          sudo warp-cli --accept-tos registration new || true
          sudo warp-cli --accept-tos connect || true
          sleep 8
          sudo warp-cli status || true
      - name: IP depois
        run: curl -s --max-time 15 https://ipinfo.io/json || true
      - name: Extrair metadados com yt-dlp
        run: |
          BIN=$(find node_modules/youtube-dl-exec/bin -maxdepth 1 -type f | head -1)
          echo "binario: $BIN"
          chmod +x "$BIN" || true
          "$BIN" --dump-single-json --skip-download --no-warnings \
            --extractor-args "youtube:player_client=web_safari,android,tv_embedded,ios" \
            "https://www.youtube.com/watch?v=FqncTKI5gd8" 2>&1 | head -c 1200 || true
