global:
  scrape_interval: 60s

scrape_configs:
  - job_name: lubacortes
    scheme: https
    metrics_path: /api/metrics
    static_configs:
      - targets: ["lubacortes.vercel.app"]
    # Se METRICS_TOKEN estiver definido na Vercel, descomentar e criar ficheiro:
    # authorization:
    #   type: Bearer
    #   bearer_token_file: /etc/prometheus/metrics_token.txt
